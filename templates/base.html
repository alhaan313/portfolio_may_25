<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
    <title>Alhaan - AI Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    {% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    {% endblock %}
</head>
<body>

    <nav class="nav" id="navbar">
        <div class="nav__inner">
            <a href="/" class="nav__logo">A.</a>
            <div class="nav__links" id="navLinks">
                <a href="#about" class="nav__link">About Me</a>
                <a href="#experience" class="nav__link">Experience</a>
                <a href="#projects" class="nav__link">Projects</a>
                <a href="#skills" class="nav__link">Skills</a>
            </div>
            <a href="mailto:a.md.alhaan@gmail.com" class="nav__cta">Get In Touch <span class="arrow">&nearr;</span></a>
            <button class="nav__burger" id="navBurger" aria-label="Menu">
                <span></span><span></span>
            </button>
        </div>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <a href="#about" class="mobile-menu__link">About Me</a>
        <a href="#experience" class="mobile-menu__link">Experience</a>
        <a href="#projects" class="mobile-menu__link">Projects</a>
        <a href="#skills" class="mobile-menu__link">Skills</a>
        <a href="mailto:a.md.alhaan@gmail.com" class="mobile-menu__link mobile-menu__cta">Get In Touch &nearr;</a>
    </div>

    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="footer__inner">
            <div class="footer__left">
                <span class="footer__logo">A.</span>
                <span class="footer__copy">&copy; 2026 Alhaan</span>
            </div>
            <div class="footer__links">
                <a href="https://github.com/alhaan313" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com/in/alhaan/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="mailto:a.md.alhaan@gmail.com">Email</a>
            </div>
        </div>
    </footer>

    <script>
        // Navbar scroll
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('nav--scrolled', window.scrollY > 50);
        });

        // Mobile menu
        const burger = document.getElementById('navBurger');
        const mobileMenu = document.getElementById('mobileMenu');
        burger.addEventListener('click', () => {
            burger.classList.toggle('active');
            mobileMenu.classList.toggle('open');
            document.body.classList.toggle('menu-open');
        });
        document.querySelectorAll('.mobile-menu__link').forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                mobileMenu.classList.remove('open');
                document.body.classList.remove('menu-open');
            });
        });

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // Scroll reveal
        const revealElements = document.querySelectorAll('.reveal');
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                }
            });
        }, { threshold: 0.1 });
        revealElements.forEach(el => revealObserver.observe(el));
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
